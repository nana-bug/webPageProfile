<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Architect Portfolio</title>
  <!-- 
      Loading Tailwind CSS.
    -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 
      Loading 'Rajdhani' (Tech headers) and 'Inter' (Clean body). 
    -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- 
      Configuring Tailwind with the new Cyber-Vogue palette.
    -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            'deep-space': '#020010',    // Almost black, hint of purple
            'cosmic-void': '#090518',   // Secondary dark background
            'neon-violet': '#a855f7',   // Primary Glow (Purple)
            'electric-blue': '#3b82f6', // Secondary Glow (Blue)
            'chrome-white': '#e2e8f0',  // Text and accents
            'glass-border': '#ffffff20', // Subtle glass borders
          },
          backgroundImage: {
            'cyber-grid': "radial-gradient(circle, rgba(168, 85, 247, 0.1) 1px, transparent 1px)",
            'chrome-gradient': "linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #e2e8f0 100%)",
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020010;
    }

    ::-webkit-scrollbar-thumb {
      background: #4c1d95;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a855f7;
    }

    /* Angled/Sleek clip path for that sharp sci-fi look */
    .clip-tech {
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
  </style>

</head>

<body class="bg-deep-space text-chrome-white selection:bg-neon-violet selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
